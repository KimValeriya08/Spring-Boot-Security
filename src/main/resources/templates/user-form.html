<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Пользователь</title>

    <style>
        .form-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .form-row label {
            width: 120px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field input[type="text"],
        .form-field input[type="number"],
        .form-field input[type="password"] {
            width: 220px;
            box-sizing: border-box;
        }

        .hint {
            margin-top: 5px;
            font-size: 14px;
            color: #666;
        }

        .error {
            margin-top: 5px;
            color: red;
        }

        .roles {
            display: flex;
            flex-direction: column;
        }

        .role-item {
            margin-bottom: 4px;
        }
    </style>
</head>

<body>

<h1>Данные пользователя</h1>

<form th:action="@{/admin/save}"
      th:object="${user}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div class="form-row">
        <label>Имя:</label>

        <div class="form-field">
            <input type="text" th:field="*{name}">

            <span class="error"
                  th:if="${#fields.hasErrors('name')}"
                  th:errors="*{name}">
            </span>
        </div>
    </div>


    <div class="form-row">
        <label>Фамилия:</label>

        <div class="form-field">
            <input type="text" th:field="*{lastName}">

            <span class="error"
                  th:if="${#fields.hasErrors('lastName')}"
                  th:errors="*{lastName}">
            </span>
        </div>
    </div>


    <div class="form-row">
        <label>Возраст:</label>

        <div class="form-field">
            <input type="number" th:field="*{age}">

            <span class="error"
                  th:if="${#fields.hasErrors('age')}"
                  th:errors="*{age}">
            </span>
        </div>
    </div>


    <div class="form-row">
        <label>Username:</label>

        <div class="form-field">
            <input type="text" th:field="*{username}">

            <span class="error"
                  th:if="${#fields.hasErrors('username')}"
                  th:errors="*{username}">
            </span>
        </div>
    </div>


    <div class="form-row">
        <label>Password:</label>

        <div class="form-field">
            <input type="password" th:field="*{password}">

            <span class="hint"
                  th:if="${user.id != null}">
                Оставьте пустым, если не хотите менять пароль
            </span>

            <span class="error"
                  th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}">
            </span>
        </div>
    </div>


    <div class="form-row">
        <label>Роли:</label>

        <div class="form-field roles">

            <div class="role-item"
                 th:each="role : ${roles}">

                <input type="checkbox"
                       th:field="*{roles}"
                       th:value="${role.id}">

                <span th:text="${role.name}"></span>
            </div>

            <span class="error"
                  th:if="${#fields.hasErrors('roles')}"
                  th:errors="*{roles}">
            </span>
        </div>
    </div>


    <button type="submit">Сохранить</button>

</form>

<br>

<a th:href="@{/admin}">Назад к списку</a>

<br><br>

<form th:action="@{/logout}" method="post">
    <button type="submit">Выйти</button>
</form>

</body>
</html>
